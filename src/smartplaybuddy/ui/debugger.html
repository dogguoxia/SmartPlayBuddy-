<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartPlayBuddy 调试面板</title>
<style>
/* ============================================================
   精密控制台 · Precision Console
   现代开发者工具美学：石墨暗色基调 + 蓝青渐变强调
   ============================================================ */
:root {
  /* 暗色主题（默认） */
  --accent: #4da3ff;
  --accent-2: #22d3ee;
  --grad: linear-gradient(135deg, #4da3ff 0%, #22d3ee 100%);
  --bg: #14161b;
  --bg-elev: #1b1e26;
  --bg-elev-2: #232734;
  --bg-input: #101218;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);
  --text: #e8eaee;
  --text-2: #9aa3b2;
  --text-3: #6b7280;
  --nav-active-bg: rgba(77, 163, 255, 0.12);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 3px 12px rgba(0, 0, 0, 0.25);
  --ring: rgba(77, 163, 255, 0.28);
  --ok: #34d399;
  --warn: #fbbf24;
  --err: #f87171;
  --font-ui: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  --font-mono: "Cascadia Code", "Cascadia Mono", Consolas, "Courier New", monospace;
}
[data-theme="light"] {
  --accent: #2563eb;
  --accent-2: #0891b2;
  --grad: linear-gradient(135deg, #2563eb 0%, #0891b2 100%);
  --bg: #f2f4f8;
  --bg-elev: #ffffff;
  --bg-elev-2: #f6f7fa;
  --bg-input: #f8f9fc;
  --border: rgba(17, 24, 39, 0.09);
  --border-strong: rgba(17, 24, 39, 0.16);
  --text: #1a202c;
  --text-2: #5b6472;
  --text-3: #9aa3b0;
  --nav-active-bg: rgba(37, 99, 235, 0.09);
  --shadow: 0 10px 30px rgba(30, 41, 59, 0.12);
  --shadow-sm: 0 3px 12px rgba(30, 41, 59, 0.08);
  --ring: rgba(37, 99, 235, 0.22);
  --ok: #059669;
  --warn: #d97706;
  --err: #dc2626;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font-ui);
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  user-select: none;
}
/* 背景氛围：顶部蓝色光晕 + 细腻网格 */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(720px 340px at 15% -10%, rgba(77, 163, 255, 0.14), transparent 65%),
    radial-gradient(560px 300px at 95% -20%, rgba(34, 211, 238, 0.10), transparent 65%);
}
[data-theme="light"] body::before {
  background:
    radial-gradient(720px 340px at 15% -10%, rgba(37, 99, 235, 0.07), transparent 65%),
    radial-gradient(560px 300px at 95% -20%, rgba(8, 145, 178, 0.05), transparent 65%);
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(rgba(128, 140, 160, 0.035) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(128, 140, 160, 0.035) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 40%, transparent 100%);
  -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 40%, transparent 100%);
}

/* ===== 顶栏 ===== */
.topbar {
  position: relative; z-index: 10;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  background: color-mix(in srgb, var(--bg-elev) 78%, transparent);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--grad);
  color: #fff; font-size: 15px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 10px rgba(77, 163, 255, 0.35);
}
.brand-name { font-size: 14px; font-weight: 650; letter-spacing: .2px; }
.brand-sub { font-size: 12px; color: var(--text-2); font-weight: 400; margin-left: 6px; }
.ws-url {
  font-size: 12px; color: var(--text-3);
  font-family: var(--font-mono);
  padding: 3px 10px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 999px;
  max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.topbar .spacer { flex: 1; }
.chip {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-2);
  font-family: var(--font-mono);
  white-space: nowrap;
}
.chip b { color: var(--text); font-weight: 600; }

/* ===== 布局 ===== */
.layout { display: flex; height: calc(100vh - 56px); position: relative; z-index: 1; }
.nav {
  width: 216px;
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  border-right: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg-elev) 55%, transparent);
}
.nav-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 13px;
  border-radius: 9px;
  cursor: pointer;
  color: var(--text-2);
  border: none;
  background: none;
  font-size: 13.5px;
  text-align: left;
  transition: background .18s, color .18s, transform .18s;
}
.nav-item:hover { background: var(--bg-elev-2); color: var(--text); }
.nav-item:active { transform: scale(.98); }
.nav-item.active {
  background: var(--nav-active-bg);
  color: var(--accent);
  font-weight: 600;
}
.nav-item.active::before {
  content: ""; position: absolute; left: -10px; top: 20%; bottom: 20%;
  width: 3px; border-radius: 2px;
  background: var(--grad);
  box-shadow: 0 0 8px rgba(77, 163, 255, 0.5);
}
.nav-item .ic { width: 17px; height: 17px; flex-shrink: 0; }
.nav-bottom { margin-top: auto; }

.content { flex: 1; overflow-y: auto; padding: 22px 24px; }
.page { display: none; }
.page.active { display: block; animation: pageIn .28s ease both; }
@keyframes pageIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
.page.active .card { animation: cardIn .42s cubic-bezier(.22,.9,.3,1) both; }
.page.active .card:nth-child(2) { animation-delay: .06s; }
@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}

/* ===== 卡片 ===== */
.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow-sm);
  padding: 18px 20px;
  margin-bottom: 16px;
  transition: box-shadow .22s, transform .22s, border-color .22s;
}
.card:hover { box-shadow: var(--shadow); border-color: var(--border-strong); }
.card h3 {
  font-size: 13.5px; font-weight: 650;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
  letter-spacing: .2px;
}
.card h3::before {
  content: ""; width: 3px; height: 14px; border-radius: 2px;
  background: var(--grad); flex-shrink: 0;
}
.card h3 .sub { color: var(--text-3); font-weight: 400; }

/* ===== 表单 ===== */
.row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
label { font-size: 12px; color: var(--text-2); }
input[type="text"], input[type="number"], select, textarea {
  font-family: inherit;
  font-size: 13px;
  color: var(--text);
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 11px;
  outline: none;
  transition: border-color .16s, box-shadow .16s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--ring);
}
textarea { font-family: var(--font-mono); width: 100%; resize: vertical; line-height: 1.55; }
select { cursor: pointer; }
select option { background: var(--bg-elev); color: var(--text); }

button {
  font-family: inherit;
  font-size: 13px;
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  padding: 7px 16px;
  cursor: pointer;
  background: var(--bg-elev-2);
  color: var(--text);
  transition: background .16s, transform .12s, box-shadow .16s, border-color .16s;
}
button:hover { background: var(--bg-input); border-color: var(--accent); }
button:active { transform: scale(.97); }
button.primary {
  background: var(--grad);
  border-color: transparent;
  color: #fff;
  font-weight: 600;
  box-shadow: 0 4px 14px rgba(77, 163, 255, 0.28);
}
button.primary:hover { filter: brightness(1.12); box-shadow: 0 6px 18px rgba(77, 163, 255, 0.38); }
button.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, transparent); }
button.danger:hover { background: color-mix(in srgb, var(--err) 12%, transparent); border-color: var(--err); }
button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
button.small { padding: 4px 11px; font-size: 12px; border-radius: 7px; }
button.icon-btn {
  width: 34px; height: 34px; padding: 0; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
}
button.icon-btn .ic { width: 15px; height: 15px; }

/* ===== 日志 ===== */
.log-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
.log-box {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 10px;
  height: calc(100vh - 290px);
  min-height: 300px;
  overflow-y: auto;
  font-family: var(--font-mono);
  font-size: 12.5px;
  padding: 8px 0;
  user-select: text;
}
.log-line {
  display: flex; gap: 10px;
  padding: 2.5px 14px 2.5px 20px;
  white-space: pre-wrap; word-break: break-all;
  position: relative;
  transition: background .12s;
}
.log-line::before {
  content: ""; position: absolute; left: 9px; top: 50%;
  transform: translateY(-50%);
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--text-3);
}
.log-line:hover { background: var(--bg-elev-2); }
.log-line .t { color: var(--text-3); flex-shrink: 0; }
.log-line .lvl { width: 70px; flex-shrink: 0; font-weight: 600; font-size: 11.5px; letter-spacing: .4px; }
.log-line .src { color: var(--text-3); flex-shrink: 0; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-line.info::before { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.log-line.info .lvl { color: var(--text); }
.log-line.debug .lvl { color: var(--text-3); }
.log-line.warning::before { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
.log-line.warning .lvl { color: var(--warn); }
.log-line.error::before, .log-line.critical::before { background: var(--err); box-shadow: 0 0 6px var(--err); }
.log-line.error .lvl, .log-line.critical .lvl { color: var(--err); }
.log-line.error { background: color-mix(in srgb, var(--err) 6%, transparent); }

/* ===== 指令测试台 ===== */
.action-bar { display: flex; gap: 10px; align-items: center; }
.action-bar select { flex: 1; }
.templates { display: flex; gap: 8px; flex-wrap: wrap; }
.templates button {
  font-size: 12px; padding: 5px 13px; border-radius: 999px;
  background: var(--bg-input);
  border-color: var(--border);
  color: var(--text-2);
}
.templates button:hover { color: var(--accent); border-color: var(--accent); background: var(--nav-active-bg); }
.result-box {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  min-height: 80px;
  max-height: 320px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-all;
  user-select: text;
  line-height: 1.55;
}

/* ===== 截图 ===== */
.shot-preview {
  background: var(--bg-input);
  border: 1.5px dashed var(--border-strong);
  border-radius: 12px;
  padding: 10px;
  text-align: center;
  min-height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color .2s;
}
.shot-preview:has(img) { border-style: solid; border-color: var(--border); }
.shot-preview img {
  max-width: 100%; max-height: 480px; border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  animation: imgIn .3s ease both;
}
@keyframes imgIn { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }
.shot-preview .placeholder { color: var(--text-3); font-size: 13px; }
.shot-preview .placeholder.pulse { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

/* ===== 文件列表 ===== */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
th {
  color: var(--text-3); font-weight: 600; font-size: 12px;
  letter-spacing: .4px;
}
tr { transition: background .12s; }
tr:hover td { background: var(--bg-elev-2); }
td:first-child { font-family: var(--font-mono); font-size: 12.5px; }
.file-actions { display: flex; gap: 6px; }
.empty-tip { color: var(--text-3); text-align: center; padding: 28px 0; font-size: 13px; }

/* ===== 开关 ===== */
.switch { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
.switch input { display: none; }
.switch .track {
  width: 40px; height: 21px; border-radius: 11px;
  background: var(--bg-input);
  border: 1px solid var(--border-strong);
  position: relative; transition: background .22s, border-color .22s;
}
.switch .track::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--text-3);
  transition: transform .22s cubic-bezier(.34,1.4,.64,1), background .22s;
}
.switch input:checked + .track { background: var(--grad); border-color: transparent; }
.switch input:checked + .track::after { transform: translateX(19px); background: #fff; }

/* ===== 自检 ===== */
.st-list { display: flex; flex-direction: column; gap: 10px; }
.st-card {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--bg-elev);
  transition: border-color .18s, box-shadow .18s;
  animation: cardIn .35s ease both;
}
.st-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.st-card.st-ok { border-left: 3px solid var(--ok); }
.st-card.st-fail { border-left: 3px solid var(--err); }
.st-name { font-weight: 650; width: 96px; font-family: var(--font-mono); font-size: 13px; }
.st-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600;
  padding: 3px 12px; border-radius: 999px;
  border: 1px solid;
}
.st-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; }
.st-ok .st-badge { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 9%, transparent); }
.st-ok .st-badge::before { background: var(--ok); box-shadow: 0 0 7px var(--ok); }
.st-fail .st-badge { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, transparent); background: color-mix(in srgb, var(--err) 9%, transparent); }
.st-fail .st-badge::before { background: var(--err); box-shadow: 0 0 7px var(--err); }
.st-time { color: var(--text-3); font-size: 12px; width: 82px; font-family: var(--font-mono); }
.st-detail { flex: 1; font-size: 12px; color: var(--text-2); word-break: break-all; }

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translate(-50%, 16px);
  background: var(--bg-elev-2);
  color: var(--text);
  border: 1px solid var(--border-strong);
  padding: 10px 22px;
  border-radius: 10px;
  font-size: 13px;
  box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; z-index: 100;
  transition: opacity .22s, transform .22s cubic-bezier(.22,.9,.3,1);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ===== 滚动条 ===== */
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 6px;
  border: 3px solid transparent;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: padding-box; border: 3px solid transparent; }
</style>
</head>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">S</div>
    <span class="brand-name">SmartPlayBuddy<span class="brand-sub">调试面板</span></span>
  </div>
  <span class="ws-url" id="wsUrl"></span>
  <span class="spacer"></span>
  <span class="chip" id="chipScreen"></span>
  <label class="switch" title="切换深浅色">
    <input type="checkbox" id="themeToggle" onchange="toggleTheme(this.checked)">
    <span class="track"></span>
  </label>
</div>

<div class="layout">
  <div class="nav">
    <button class="nav-item active" data-page="logs" onclick="switchPage('logs')"><svg class="ic"><use href="#i-logs"/></svg><span>日志</span></button>
    <button class="nav-item" data-page="command" onclick="switchPage('command')"><svg class="ic"><use href="#i-command"/></svg><span>指令测试台</span></button>
    <button class="nav-item" data-page="screenshot" onclick="switchPage('screenshot')"><svg class="ic"><use href="#i-shot"/></svg><span>截图预览</span></button>
    <button class="nav-item" data-page="files" onclick="switchPage('files')"><svg class="ic"><use href="#i-files"/></svg><span>截图文件</span></button>
    <button class="nav-item" data-page="selftest" onclick="switchPage('selftest')"><svg class="ic"><use href="#i-selftest"/></svg><span>驱动自检</span></button>
    <button class="nav-item nav-bottom" onclick="api_call('open_save_dir')"><svg class="ic"><use href="#i-open"/></svg><span>打开截图目录</span></button>
  </div>

  <div class="content">
    <!-- 日志 -->
    <div class="page active" id="page-logs">
      <div class="card">
        <div class="log-toolbar">
          <select id="logLevel" onchange="renderLogs()">
            <option value="all">全部级别</option>
            <option value="info">INFO+</option>
            <option value="warning">WARNING+</option>
            <option value="error">ERROR</option>
          </select>
          <input type="text" id="logSearch" placeholder="搜索日志…" oninput="renderLogs()" style="flex:1">
          <button onclick="clearLogs()">清空</button>
          <button class="icon-btn" onclick="loadLogs()" title="刷新"><svg class="ic"><use href="#i-refresh"/></svg></button>
        </div>
        <div class="log-box" id="logBox"></div>
      </div>
    </div>

    <!-- 指令测试台 -->
    <div class="page" id="page-command">
      <div class="card">
        <h3>发送驱动指令</h3>
        <div class="action-bar">
          <select id="cmdAction"></select>
          <button class="primary" onclick="runCommand()">执行</button>
        </div>
        <div class="row" style="margin-top:10px">
          <label>data (JSON)：</label>
        </div>
        <textarea id="cmdData" rows="6" spellcheck="false">{
  "operate": "screenshot",
  "monitor": 0
}</textarea>
        <div class="row" style="margin-top:10px">
          <span style="font-size:12px;color:var(--text-2)">快捷模板：</span>
          <div class="templates" id="templates"></div>
        </div>
      </div>
      <div class="card">
        <h3>执行结果</h3>
        <div class="result-box" id="cmdResult">尚未执行指令。</div>
      </div>
    </div>

    <!-- 截图预览 -->
    <div class="page" id="page-screenshot">
      <div class="card">
        <h3>按需截图</h3>
        <div class="row">
          <label>显示器索引 (0=主屏)</label>
          <input type="number" id="shotMonitor" value="0" min="0" style="width:90px">
          <label>保存路径</label>
          <input type="text" id="shotSave" placeholder="留空使用默认目录" style="width:220px">
          <button onclick="chooseSaveDir()">选择</button>
          <button class="primary" onclick="takeScreenshot()">截图</button>
        </div>
      </div>
      <div class="card">
        <h3>预览</h3>
        <div class="shot-preview" id="shotPreview">
          <span class="placeholder">点击"截图"生成预览</span>
        </div>
        <div class="row" style="margin-top:10px">
          <span id="shotInfo" style="font-size:12px;color:var(--text-2)"></span>
        </div>
      </div>
    </div>

    <!-- 截图文件 -->
    <div class="page" id="page-files">
      <div class="card">
        <h3>已保存的截图 <span class="sub" id="filesCount"></span></h3>
        <div id="filesList"></div>
      </div>
    </div>

    <!-- 驱动自检 -->
    <div class="page" id="page-selftest">
      <div class="card">
        <h3>驱动自检</h3>
        <div class="row">
          <button class="primary" id="btnSelfTestAll" onclick="startSelfTest()">全部自检</button>
          <span style="font-size:12px;color:var(--text-2)">
            安全模式：键盘按 F13 无害键、鼠标移到屏幕中心（不点击）、屏幕抓一帧验证成像链路。
            首次加载驱动可能较慢（需启动子进程 / 安装依赖）。
          </span>
        </div>
      </div>
      <div class="card">
        <h3>自检结果 <span class="sub" id="selfTestSummary"></span></h3>
        <div id="selfTestList"><div class="empty-tip">点击"全部自检"开始测试各驱动</div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const LOG_LEVELS = ["debug", "info", "warning", "error", "critical"];
let allLogs = [];
let meta = null;

function api_call(name, ...args) {
  if (window.pywebview && window.pywebview.api) {
    return Promise.resolve().then(() => window.pywebview.api[name](...args));
  }
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    const timer = setInterval(() => {
      if (window.pywebview && window.pywebview.api) {
        clearInterval(timer);
        try { resolve(window.pywebview.api[name](...args)); }
        catch (e) { reject(e); }
      } else if (Date.now() - t0 > 15000) {
        clearInterval(timer);
        reject(new Error("pywebview 未就绪(等待超时)"));
      }
    }, 100);
  });
}

function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2000);
}

function fmtSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
function fmtTime(ts) {
  const d = new Date(ts * 1000);
  const p = (x) => String(x).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

/* ===== 主题 ===== */
function toggleTheme(dark) {
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  localStorage.setItem("smtp-theme", dark ? "dark" : "light");
}
(() => {
  let saved = localStorage.getItem("smtp-theme");
  if (!saved) saved = "dark";
  document.documentElement.setAttribute("data-theme", saved);
  $("themeToggle").checked = saved === "dark";
})();

/* ===== 页面切换 ===== */
function switchPage(name) {
  document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", b.dataset.page === name));
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === "page-" + name));
  if (name === "files") loadFiles();
}

/* ===== 日志 ===== */
function pushLog(entry) {
  allLogs.push(entry);
  if (allLogs.length > 500) allLogs.shift();
  if ($("page-logs").classList.contains("active")) renderLogs();
}
function renderLogs() {
  const level = $("logLevel").value;
  const kw = $("logSearch").value.toLowerCase();
  const box = $("logBox");
  box.innerHTML = "";
  let lines = 0;
  for (const e of allLogs) {
    const lvl = e.level.toLowerCase();
    if (level === "info" && !["info", "warning", "error", "critical"].includes(lvl)) continue;
    if (level === "warning" && !["warning", "error", "critical"].includes(lvl)) continue;
    if (level === "error" && !["error", "critical"].includes(lvl)) continue;
    if (kw && !(e.message.toLowerCase().includes(kw) || e.name.toLowerCase().includes(kw))) continue;
    const line = document.createElement("div");
    line.className = "log-line " + (LOG_LEVELS.includes(lvl) ? lvl : "info");
    line.innerHTML = `<span class="t">${e.time}</span><span class="lvl">${e.level}</span><span class="src">${e.name}</span><span class="msg"></span>`;
    line.lastElementChild.textContent = e.message;
    box.appendChild(line);
    lines++;
  }
  if (!lines) box.innerHTML = '<div class="log-line" style="color:var(--text-3)">无日志</div>';
  box.scrollTop = box.scrollHeight;
}
function clearLogs() { allLogs = []; renderLogs(); }
function loadLogs() {
  api_call("get_logs").then(rows => { allLogs = rows; renderLogs(); }).catch(err => toast("加载日志失败: " + err));
}
window.__pushLog = (entry) => pushLog(entry);

/* ===== 指令测试台 ===== */
const TEMPLATES = {
  keyboard: [
    { name: "单击 A", data: { operate: "tap", key: "a" } },
    { name: "组合 Ctrl+C", data: { operate: "combo", keys: ["ctrl", "c"] } },
  ],
  mouse: [
    { name: "移动到中心", data: { operate: "move_to", x: 0.5, y: 0.5, duration: 0.5 } },
    { name: "左键单击", data: { operate: "tap", button: "left" } },
    { name: "滚轮滚动", data: { operate: "scroll", y: -300 } },
  ],
  screen: [
    { name: "整屏截图", data: { operate: "screenshot", monitor: 0, return_image: false } },
    { name: "开始捕获", data: { operate: "capture_start", monitor: 0, name: "debug", minimum_update_interval: 100 } },
    { name: "取最新帧", data: { operate: "capture_frame", name: "debug", return_image: false } },
    { name: "停止捕获", data: { operate: "capture_stop", name: "debug" } },
    { name: "捕获列表", data: { operate: "capture_list" } },
  ],
};
function buildCommandPage() {
  if (!meta) return;
  const sel = $("cmdAction");
  sel.innerHTML = "";
  for (const a of meta.drivers) {
    const opt = document.createElement("option");
    opt.value = a;
    opt.textContent = a;
    sel.appendChild(opt);
  }
  $("cmdAction").addEventListener("change", () => {
    const t = TEMPLATES[sel.value];
    $("templates").innerHTML = "";
    if (t) for (const item of t) {
      const btn = document.createElement("button");
      btn.textContent = item.name;
      btn.onclick = () => { $("cmdData").value = JSON.stringify(item.data, null, 2); };
      $("templates").appendChild(btn);
    }
  });
  $("cmdAction").dispatchEvent(new Event("change"));
}
function runCommand() {
  const action = $("cmdAction").value;
  const data = $("cmdData").value;
  $("cmdResult").textContent = "执行中…";
  api_call("run_command", action, data).then(r => {
    $("cmdResult").textContent = JSON.stringify(r, null, 2);
  }).catch(err => { $("cmdResult").textContent = "错误: " + err; });
}

/* ===== 截图预览 ===== */
function chooseSaveDir() {
  api_call("choose_save_dir").then(r => {
    if (r.status === "ok") {
      if (r.path) $("shotSave").value = r.path;
      else toast("已取消选择");
    } else {
      toast("选择路径失败: " + (r.message || ""));
    }
  }).catch(err => toast("选择路径失败: " + err));
}

function takeScreenshot() {
  const preview = $("shotPreview");
  preview.innerHTML = '<span class="placeholder pulse">截图生成中…</span>';
  $("shotInfo").textContent = "";
  const m = parseInt($("shotMonitor").value, 10);
  api_call("screenshot", isNaN(m) ? 0 : m, $("shotSave").value).then(r => {
    if (r.status === "ok" && r.data) {
      preview.innerHTML = `<img src="data:image/png;base64,${r.data}" alt="screenshot">`;
      $("shotInfo").textContent = `${r.width} × ${r.height} | 已保存: ${r.path || r.file}`;
    } else {
      preview.innerHTML = '<span class="placeholder" style="color:var(--err)">截图失败</span>';
      $("shotInfo").textContent = r.message || JSON.stringify(r);
    }
  }).catch(err => {
    preview.innerHTML = '<span class="placeholder" style="color:var(--err)">截图失败</span>';
    $("shotInfo").textContent = "错误: " + err;
  });
}

/* ===== 截图文件 ===== */
function loadFiles() {
  api_call("list_screenshots").then(r => {
    const box = $("filesList");
    $("filesCount").textContent = r.status === "ok" ? `(${r.files.length})` : "";
    if (r.status !== "ok" || !r.files.length) {
      box.innerHTML = '<div class="empty-tip">暂无截图文件，可在"截图预览"页生成</div>';
      return;
    }
    let html = "<table><thead><tr><th>文件名</th><th>大小</th><th>时间</th><th style=\"width:120px\">操作</th></tr></thead><tbody>";
    for (const f of r.files) {
      html += `<tr>
        <td>${f.name}</td>
        <td>${fmtSize(f.size)}</td>
        <td>${fmtTime(f.mtime)}</td>
        <td><div class="file-actions">
          <button class="small" onclick="openFile('${f.name}')">打开</button>
          <button class="small danger" onclick="deleteFile('${f.name}')">删除</button>
        </div></td>
      </tr>`;
    }
    box.innerHTML = html + "</tbody></table>";
  }).catch(err => { $("filesList").innerHTML = '<div class="empty-tip">加载失败: ' + err + "</div>"; });
}
function openFile(name) {
  api_call("open_screenshot", name).then(r => { if (r.status !== "ok") toast(r.message || "打开失败"); });
}
function deleteFile(name) {
  if (!confirm(`删除截图「${name}」？`)) return;
  api_call("delete_screenshot", name).then(r => {
    if (r.status === "ok") { toast("已删除"); loadFiles(); }
    else toast(r.message || "删除失败");
  });
}

/* ===== 驱动自检 ===== */
let selfTestResults = {};
function startSelfTest() {
  $("btnSelfTestAll").disabled = true;
  selfTestResults = {};
  $("selfTestSummary").textContent = "测试中…";
  $("selfTestList").innerHTML = '<div class="empty-tip">正在测试驱动，请稍候…（首次加载驱动可能需要安装依赖）</div>';
  api_call("start_self_test").catch(err => {
    toast("启动自检失败: " + err);
    finishSelfTest();
  });
}
function startSelfTestOne(action) {
  const btn = document.querySelector(`[data-st-action="${action}"]`);
  if (btn) btn.disabled = true;
  api_call("start_self_test_one", action).catch(err => toast("启动自检失败: " + err));
}
function renderSelfTestItem(item) {
  selfTestResults[item.action] = item;
  const box = $("selfTestList");
  const actions = Object.keys(selfTestResults).sort();
  if (!actions.length) return;
  let html = '<div class="st-list">';
  for (const a of actions) {
    const it = selfTestResults[a];
    const ok = it.status === "ok";
    html += `<div class="st-card ${ok ? "st-ok" : "st-fail"}">
      <span class="st-name">${a}</span>
      <span class="st-badge">${ok ? "通过" : "失败"}</span>
      <span class="st-time">${it.elapsed_ms} ms</span>
      <span class="st-detail">${escapeHtml(it.detail || "")}</span>
      <button class="small" data-st-action="${a}" onclick="startSelfTestOne('${a}')">重测</button>
    </div>`;
  }
  box.innerHTML = html + "</div>";
}
function finishSelfTest() {
  $("btnSelfTestAll").disabled = false;
  const results = Object.values(selfTestResults);
  const pass = results.filter(r => r.status === "ok").length;
  $("selfTestSummary").textContent = results.length ? `(${pass}/${results.length} 通过)` : "";
}
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
window.__onTestEvent = (evt) => {
  if (evt.type === "meta_ready") initMeta(evt.error);
  else if (evt.type === "self_test_item") renderSelfTestItem(evt.item);
  else if (evt.type === "self_test_done") {
    if (evt.error) toast("自检出错: " + evt.error);
    else toast("自检完成");
    finishSelfTest();
  }
};

/* ===== 初始化 ===== */
function initMeta(err) {
  api_call("get_meta").then(m => {
    meta = m;
    $("wsUrl").textContent = m.ws_url;
    $("chipScreen").innerHTML = `屏幕 <b>${m.screen_size[0]}×${m.screen_size[1]}</b>`;
    buildCommandPage();
    loadLogs();
    toast(err ? "面板已就绪（驱动扫描异常，详见日志）" : "调试面板已就绪");
  }).catch(e => toast("初始化失败: " + e));
}
window.addEventListener("pywebviewready", () => {
  api_call("on_ready").then(() => {
    $("wsUrl").textContent = "驱动扫描中…";
  });
});
</script>
</body>
</html>
